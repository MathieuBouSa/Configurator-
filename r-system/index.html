/* ─── UI ─── */
const StepBadge = ({ step }) =>
  h("div",{className:"inline-flex items-center gap-2 rounded-full bg-[var(--cyan)]/10 px-3 py-1 text-xs font-bold tracking-wide text-[var(--cyan)] uppercase"},
    h("span",{className:"font-ubuntu"},"Étape "+step+" / 4"));

const Tile = ({ title, sub, onClick, selected, right, logo }) =>
  h("button",{onClick,
    className:"tile text-left w-full rounded-2xl border-2 bg-white p-5 "+(selected?"border-[var(--cyan)] ring-2 ring-[var(--cyan)]/20":"border-slate-200")},
    h("div",{className:"flex items-center justify-between gap-3"},
      h("div",{className:"min-w-0"},
        logo ? h("img",{src:logo,alt:title,className:"object-contain object-left",style:{height:40,maxWidth:200}})
             : h("div",{className:"font-ubuntu font-bold text-lg text-[var(--navy)]"},title),
        sub&&h("div",{className:"mt-1 text-sm text-slate-500 leading-snug"},sub)),
      right ? h("span",{className:"shrink-0 text-sm font-semibold text-slate-400"},right)
            : selected&&h("span",{className:"shrink-0 grid h-6 w-6 place-items-center rounded-full bg-[var(--cyan)] text-white"},h(Check,{size:14}))
    ));

const Counter = ({ value, set, min=0, max=200, label, hint, img }) =>
  h("div",{className:"rounded-2xl border-2 border-slate-200 bg-white p-5"},
    h("div",{className:"flex items-center gap-4"},
      img&&h("img",{src:img,alt:"",className:"rounded-xl object-contain",style:{width:64,height:64,flexShrink:0}}),
      h("div",{className:"flex-1 min-w-0"},
        h("div",{className:"font-ubuntu font-bold text-[var(--navy)]"},label),
        hint&&h("div",{className:"mt-1 text-sm text-slate-500"},hint))),
    h("div",{className:"mt-4 flex items-center justify-center gap-5"},
      h("button",{onClick:()=>set(Math.max(min,value-1)),className:"stepBtn h-12 w-12 rounded-full grid place-items-center text-white bg-[var(--navy)]",disabled:value<=min},h(Minus,{size:18})),
      h("div",{className:"font-ubuntu font-bold text-4xl w-16 text-center tabular-nums"},value),
      h("button",{onClick:()=>set(Math.min(max,value+1)),className:"stepBtn h-12 w-12 rounded-full grid place-items-center text-white bg-[var(--cyan)]"},h(Plus,{size:18}))
    ));

/* ─── App ─── */
function App(){
  const [step,setStep]       = useState(1);   // 1 brand, 2 model, 3 plenum/outputs, 4 thermostats
  const [brand,setBrand]     = useState(null);
  const [model,setModel]     = useState(null);
  const [choice,setChoice]   = useState(null); // {ref,size,outputs}
  const [thermostats,setTh]  = useState(1);
  const [done,setDone]       = useState(false);
  const [copied,setCopied]   = useState(false);
  const [pdfReady,setPdfReady]= useState(false);

  useEffect(()=>{ const c=()=>{ if(window.jspdf) setPdfReady(true); else setTimeout(c,200);}; c(); },[]);

  function next(){ setStep(s=>Math.min(4,s+1)); }
  function back(){
    if(done){ setDone(false); return; }
    if(step===4) setChoice(null);
    if(step===3) setModel(null);
    if(step===2) setBrand(null);
    setStep(s=>Math.max(1,s-1));
  }
  function reset(){ setStep(1); setBrand(null); setModel(null); setChoice(null); setTh(1); setDone(false); setCopied(false); }

  const models = brand ? Object.keys(DATA[brand]) : [];
  const opts = (brand&&model) ? DATA[brand][model].opts : [];

  const recap = useMemo(()=>{
    if(!done||!choice) return "";
    const bl = BRANDS.find(b=>b.id===brand).label;
    return [
      "CONFIGURATION — R-System SALUS Controls",
      "",
      "Pompe à chaleur : "+bl+" "+model,
      "Plénum motorisé : "+choice.ref,
      "  ("+choice.outputs+" sorties · taille "+choice.size+")",
      thermostats+" × "+THERMOSTAT_REF+" (thermostat sans fil)",
      "App SALUS Premium Lite",
      "",
      "Garantie 5 ans · Assemblé en France · Configuration avec ou sans internet.",
    ].join("\n");
  },[done,brand,model,choice,thermostats]);

  function copyRecap(){ navigator.clipboard?.writeText(recap).then(()=>{ setCopied(true); setTimeout(()=>setCopied(false),1600); }); }
  function emailRecap(){
    const subject="Demande de chiffrage — R-System SALUS";
    window.location.href=`mailto:${QUOTE_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(recap)}`;
  }
  function downloadPdf(){
    if(!window.jspdf||!choice) return;
    const { jsPDF } = window.jspdf;
    const doc=new jsPDF({unit:"mm",format:"a4"});
    const navy=[29,40,88],cyan=[0,174,239];
    doc.setFillColor(...navy); doc.rect(0,0,210,40,"F");
    doc.setFillColor(...cyan); doc.rect(0,40,210,2,"F");
    doc.setTextColor(255,255,255); doc.setFont("helvetica","bold"); doc.setFontSize(20);
    doc.text("SALUS Controls",20,20);
    doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.text("Récapitulatif de configuration",20,30);
    doc.setTextColor(...navy); doc.setFont("helvetica","bold"); doc.setFontSize(14);
    doc.text("R-System — Plénum motorisé pièce par pièce",20,56);

    const bl=BRANDS.find(b=>b.id===brand).label;
    let rows=[
      ["Pompe à chaleur", bl+" "+model],
      ["Plénum motorisé", choice.ref],
      ["Configuration", choice.outputs+" sorties · taille "+choice.size],
      [THERMOSTAT_REF+" (thermostats)", String(thermostats)],
    ];
    let y=70; doc.setFontSize(11);
    rows.forEach((r,i)=>{
      if(i%2===0){ doc.setFillColor(240,248,255); doc.rect(20,y-5,170,9,"F"); }
      doc.setFont("helvetica","bold"); doc.setTextColor(...navy); doc.text(r[0],24,y);
      doc.setFont("helvetica","normal"); doc.setTextColor(60,60,80); doc.text(String(r[1]),120,y);
      y+=9;
    });
    y+=6; doc.setDrawColor(...cyan); doc.setLineWidth(.4); doc.line(20,y,190,y); y+=9;
    doc.setFont("helvetica","bold"); doc.setTextColor(...navy); doc.setFontSize(13);
    doc.text("Documentation", 20, y); y+=8;
    LINKS.forEach(l=>{
      doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(...cyan);
      doc.textWithLink(l.label, 24, y, {url:l.url});
      const tw=doc.getTextWidth(l.label); doc.setDrawColor(...cyan); doc.setLineWidth(.3); doc.line(24,y+1,24+tw,y+1);
      y+=7;
    });
    y+=4; doc.setDrawColor(...cyan); doc.setLineWidth(.4); doc.line(20,y,190,y); y+=8;
    doc.setFont("helvetica","normal"); doc.setTextColor(90,90,110); doc.setFontSize(9.5);
    doc.text("Garantie 5 ans. Assemblé en France. Configuration avec ou sans internet.",20,y); y+=6;
    doc.text("Chiffrage : "+QUOTE_EMAIL+"  ·  "+SUPPORT_PHONE,20,y); y+=6;
    doc.setTextColor(...cyan); doc.textWithLink(SITE,20,y,{url:SITE});
    doc.save(`config-r-system-${choice.ref}.pdf`);
  }

  /* ─── Rendu ─── */
  return h("div",{className:"mx-auto max-w-3xl px-4 py-8 sm:py-12"},

    h("div",{className:"mb-8 flex items-center justify-between"},
      h("div",{className:"flex items-center gap-3"},
        h("div",{className:"grid h-11 w-11 place-items-center rounded-xl bg-[var(--navy)] text-white font-ubuntu font-bold text-xl"},"R"),
        h("div",null,
          h("div",{className:"font-ubuntu font-bold text-[var(--navy)] leading-tight"},"R-System ", h("span",{className:"text-slate-400 font-normal text-sm"},"by SALUS")),
          h("div",{className:"text-xs text-slate-500"},"Configurateur plénum motorisé"))),
      (step>1||done)&&h("button",{onClick:back,
        className:"inline-flex items-center gap-1.5 rounded-full border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-[var(--navy)] hover:border-[var(--cyan)]"},
        h(ArrowLeft,{size:15})," Retour")),

    !done&&h("div",{className:"mb-8 flex gap-2"},
      [1,2,3,4].map(n=>h("div",{key:n,className:"h-1.5 flex-1 overflow-hidden rounded-full bg-slate-200"},
        h("div",{className:"h-full bg-[var(--cyan)] transition-all duration-500",style:{width: step>n?"100%":step===n?"55%":"0%"}})))),

    /* ÉTAPE 1 — marque PAC */
    !done&&step===1&&h("section",{className:"fadeUp"},
      h(StepBadge,{step:1}),
      h("h1",{className:"mt-3 font-ubuntu font-bold text-2xl sm:text-3xl text-[var(--navy)]"},"Marque de la pompe à chaleur"),
      h("p",{className:"mt-1 mb-6 text-slate-500"},"Le plénum R-System s'adapte à la marque et au modèle de votre unité gainable."),
      h("div",{className:"grid gap-3"},
        BRANDS.map(b=>h(Tile,{key:b.id,title:b.label,logo:b.logo,sub:"Série "+b.series,selected:brand===b.id,
          onClick:()=>{ setBrand(b.id); setModel(null); setChoice(null); next(); }})))),

    /* ÉTAPE 2 — modèle */
    !done&&step===2&&h("section",{className:"fadeUp"},
      h(StepBadge,{step:2}),
      h("h1",{className:"mt-3 font-ubuntu font-bold text-2xl sm:text-3xl text-[var(--navy)]"},"Modèle "+BRANDS.find(b=>b.id===brand).label),
      h("p",{className:"mt-1 mb-6 text-slate-500"},"Sélectionnez la référence exacte de l'unité intérieure."),
      h("div",{className:"grid gap-3 sm:grid-cols-2"},
        models.map(m=>h(Tile,{key:m,title:m,right:DATA[brand][m].kW+" kW",selected:model===m,
          onClick:()=>{ setModel(m); setChoice(null); next(); }})))),

    /* ÉTAPE 3 — plénum / sorties */
    !done&&step===3&&h("section",{className:"fadeUp"},
      h(StepBadge,{step:3}),
      h("h1",{className:"mt-3 font-ubuntu font-bold text-2xl sm:text-3xl text-[var(--navy)]"},"Plénum motorisé"),
      h("p",{className:"mt-1 mb-4 text-slate-500"},"Choisissez le nombre de sorties (registres) selon le nombre de pièces à desservir."),
      /* photo plénum */
      h("div",{className:"mb-5 rounded-2xl border-2 border-slate-200 bg-white p-4"},
        h("img",{src:PLENUM_IMG,alt:"Plénum motorisé R-System",className:"w-full object-contain",style:{maxHeight:220}}),
        h("p",{className:"mt-2 text-center text-xs text-slate-400"},"Photo d'exemple — l'aspect réel du plénum varie selon le nombre de sorties et le modèle de pompe à chaleur.")),
      h("div",{className:"grid gap-3 sm:grid-cols-2"},
        opts.map(o=>h(Tile,{key:o.ref,title:o.outputs+" sorties",sub:o.ref+" · taille "+o.size,selected:choice&&choice.ref===o.ref&&choice.outputs===o.outputs,
          onClick:()=>{ setChoice(o); next(); }})))),

    /* ÉTAPE 4 — thermostats */
    !done&&step===4&&h("section",{className:"fadeUp"},
      h(StepBadge,{step:4}),
      h("h1",{className:"mt-3 font-ubuntu font-bold text-2xl sm:text-3xl text-[var(--navy)]"},"Thermostats "+THERMOSTAT_REF),
      h("p",{className:"mt-1 mb-2 text-slate-500"},"Un thermostat sans fil par zone à réguler. Suggestion : 1 par sortie de plénum"+(choice?" ("+choice.outputs+")":"")+"."),
      h("div",{className:"mb-6 rounded-xl bg-[var(--teal)]/10 border border-[var(--teal)]/30 p-3 text-sm text-[var(--navy)]"},
        "Pilotage par l'application SALUS Premium Lite."),
      h(Counter,{value:thermostats,set:setTh,min:1,max:choice?choice.outputs:8,img:THERMO_IMG,
        label:THERMOSTAT_REF+" — Thermostat sans fil",hint:"Rechargeable USB-C · design ultra-fin · support mural magnétique."}),
      h("div",{className:"mt-7"},
        h("button",{onClick:()=>setDone(true),
          className:"inline-flex items-center gap-2 rounded-full bg-[var(--navy)] px-7 py-3 font-ubuntu font-bold text-white hover:brightness-110"},
          "Voir le récapitulatif ",h(ArrowRight,{size:16})))),

    /* RÉCAP */
    done&&choice&&h("section",{className:"fadeUp"},
      h("div",{className:"relative overflow-hidden rounded-3xl bg-[var(--navy)] p-6 sm:p-8 text-white arcs"},
        h("div",{className:"relative"},
          h("div",{className:"inline-flex items-center gap-2 rounded-full bg-white/15 px-3 py-1 text-xs font-bold uppercase tracking-wide"},
            h(CheckCircle,{size:14})," Configuration prête"),
          h("h1",{className:"mt-3 font-ubuntu font-bold text-2xl sm:text-3xl"},"Votre solution R-System"),
          h("div",{className:"mt-6 grid gap-2.5"},
            [
              ["1 ×", choice.ref, "Plénum motorisé · "+choice.outputs+" sorties · "+choice.size, PLENUM_IMG],
              [thermostats+" ×", THERMOSTAT_REF, "Thermostat sans fil — pilotage par zone", THERMO_IMG],
            ].map((r,i)=>h("div",{key:i,className:"flex items-center gap-4 rounded-xl bg-white/8 px-4 py-3"},
              r[3] ? h("img",{src:r[3],alt:r[1],className:"object-contain",style:{width:56,height:56,flexShrink:0}})
                   : h("div",{className:"font-ubuntu font-bold text-[var(--cyan)] w-11 shrink-0 tabular-nums text-sm"},r[0]),
              h("div",{className:"flex-1 min-w-0"},
                h("div",{className:"font-ubuntu font-bold flex items-baseline gap-2"},
                  h("span",{className:"text-[var(--cyan)] tabular-nums text-sm"},r[0]), r[1]),
                h("div",{className:"text-sm text-white/60"},r[2]))))),
          h("p",{className:"mt-3 text-xs text-white/50"},
            "Pompe à chaleur : "+BRANDS.find(b=>b.id===brand).label+" "+model),
          h("p",{className:"mt-4 text-sm text-white/70"},
            "Garantie 5 ans · Assemblé en France · Fonctionne avec ou sans internet."))),

      h("div",{className:"mt-5 grid gap-3 sm:grid-cols-3"},
        h("button",{onClick:downloadPdf,disabled:!pdfReady,
          className:"stepBtn inline-flex items-center justify-center gap-2 rounded-xl bg-[var(--cyan)] px-4 py-3 font-ubuntu font-bold text-white hover:brightness-105"},
          h(Download,{size:16})," ",pdfReady?"Télécharger PDF":"Chargement…"),
        h("button",{onClick:emailRecap,
          className:"inline-flex items-center justify-center gap-2 rounded-xl border-2 border-[var(--navy)] px-4 py-3 font-ubuntu font-bold text-[var(--navy)] hover:bg-[var(--navy)] hover:text-white"},
          h(Mail,{size:16})," Demander un chiffrage"),
        h("button",{onClick:copyRecap,
          className:"inline-flex items-center justify-center gap-2 rounded-xl border-2 border-slate-300 px-4 py-3 font-ubuntu font-bold text-[var(--navy)] hover:border-[var(--cyan)]"},
          copied?h(Check,{size:16}):h(Copy,{size:16})," ",copied?"Copié !":"Copier")),

      /* Documentation */
      h("div",{className:"mt-8"},
        h("h2",{className:"font-ubuntu font-bold text-xl text-[var(--navy)]"},"Documentation R-System"),
        h("p",{className:"mt-1 mb-4 text-sm text-slate-500"},"Brochure, manuel d'installation et présentation vidéo."),
        h("div",{className:"grid gap-2.5"},
          LINKS.map((l,i)=>h("a",{key:i,href:l.url,target:"_blank",rel:"noopener",
            className:"tile flex items-center justify-between gap-3 rounded-xl border-2 border-slate-200 bg-white px-4 py-3"},
            h("div",{className:"flex items-center gap-3"},
              h("span",{className:"grid h-9 w-9 shrink-0 place-items-center rounded-lg bg-[var(--cyan)]/10 text-[var(--cyan)]"},h(l.icon,{size:17})),
              h("div",{className:"font-ubuntu font-bold text-[var(--navy)]"},l.label)),
            h("span",{className:"shrink-0 text-[var(--cyan)]"},h(Download,{size:18})))))),

      h("div",{className:"mt-8 rounded-2xl border border-slate-200 bg-white p-5"},
        h("div",{className:"font-ubuntu font-bold text-[var(--navy)] mb-3"},"Besoin d'un coup de main ?"),
        h("div",{className:"grid gap-2.5 sm:grid-cols-3 text-sm"},
          h("a",{href:`mailto:${QUOTE_EMAIL}`,className:"flex items-center gap-2 text-[var(--navy)] hover:text-[var(--cyan)]"},h(Mail,{size:15}),QUOTE_EMAIL),
          h("a",{href:`tel:${SUPPORT_PHONE.replace(/[^0-9+]/g,"")}`,className:"flex items-center gap-2 text-[var(--navy)] hover:text-[var(--cyan)]"},h(Phone,{size:15}),SUPPORT_PHONE),
          h("a",{href:SITE,target:"_blank",rel:"noopener",className:"flex items-center gap-2 text-[var(--navy)] hover:text-[var(--cyan)]"},h(Globe,{size:15}),"saluscontrols.com/fr"))),
      h("div",{className:"mt-5 text-center"},
        h("button",{onClick:reset,className:"inline-flex items-center gap-2 text-sm font-semibold text-slate-500 hover:text-[var(--navy)]"},
          h(RotateCcw,{size:15})," Nouvelle configuration")),

      /* Grande photo du plénum — fond transparent */
      h("div",{className:"mt-10 text-center"},
        h("img",{src:PLENUM_IMG,alt:"Plénum motorisé R-System",className:"mx-auto w-full max-w-2xl object-contain",style:{background:"transparent"}}),
        h("p",{className:"mt-3 text-xs text-slate-400 italic max-w-xl mx-auto"},
          "Photo d'exemple — l'aspect réel du plénum varie selon le nombre de sorties et le modèle de pompe à chaleur."))),

    h("div",{className:"mt-12 border-t border-slate-200 pt-5 text-center text-xs text-slate-400"},
      "R-System by SALUS Controls — membre du groupe Computime · Régulation gainable pièce par pièce")
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
