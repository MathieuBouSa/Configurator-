<!DOCTYPE html>
<!-- Stage for the trade-show videos (see build/video/record.mjs).
     A 1280 x 720 page, captured at x1.5 = 1920 x 1080: a brand panel on
     the left (steps + caption) and the live site in a browser window on
     the right. The cursor and the full-screen cards come from overlay.js.
     Nothing here runs on its own: record.mjs drives every change and
     owns the clock, so the CSS transitions below are frame-exact. -->
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Salus - video stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{ --cyan:#00AEEF; --navy:#1D2858; --teal:#3FB8A5; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; width:1280px; height:720px; overflow:hidden; background:var(--navy); }
  body{ font-family:'Open Sans', system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  .ubu{ font-family:'Ubuntu', system-ui, sans-serif; }

  .bg{
    position:absolute; inset:0; overflow:hidden;
    background:
      radial-gradient(900px 620px at -12% 112%, rgba(0,174,239,.24) 0%, transparent 60%),
      radial-gradient(760px 520px at 112% -12%, rgba(0,174,239,.15) 0%, transparent 60%),
      var(--navy);
  }
  /* Brand arcs, as on the configurator pages */
  .bg::before, .bg::after{
    content:""; position:absolute; border-radius:50%;
    border:1.5px solid rgba(0,174,239,.20);
    box-shadow:0 0 0 34px rgba(0,174,239,.05), 0 0 0 84px rgba(0,174,239,.035), 0 0 0 140px rgba(0,174,239,.02);
  }
  .bg::before{ width:620px; height:620px; left:-300px; bottom:-330px; }
  .bg::after{ width:520px; height:520px; right:-260px; top:-300px; }

  /* ---------- left panel ---------- */
  #panel{
    position:absolute; left:0; top:0; width:392px; height:720px;
    padding:46px 34px 40px 46px; color:#fff; display:flex; flex-direction:column;
  }
  .logo{ height:30px; width:auto; align-self:flex-start; filter:brightness(0) invert(1); }
  .eyebrow{ margin-top:40px; font:700 12px/1 'Ubuntu',sans-serif; letter-spacing:.16em; text-transform:uppercase; color:var(--cyan); }
  #panel h1{ margin:12px 0 0; font:700 29px/1.16 'Ubuntu',sans-serif; }
  .sub{ margin-top:10px; font-size:14.5px; line-height:1.5; color:rgba(255,255,255,.66); }

  ol.steps{ list-style:none; padding:0; margin:28px 0 0; display:grid; gap:5px; }
  .steps li{
    display:flex; align-items:center; gap:12px; padding:8px 12px; border-radius:12px;
    font:500 15px/1.25 'Ubuntu',sans-serif; color:rgba(255,255,255,.42);
    transition:background-color .45s ease, color .45s ease;
  }
  .steps .n{
    flex:none; width:26px; height:26px; border-radius:50%; display:grid; place-items:center;
    border:1.5px solid rgba(255,255,255,.28); font:700 12px/1 'Ubuntu',sans-serif;
    transition:background-color .45s ease, border-color .45s ease;
  }
  .steps li.done{ color:rgba(255,255,255,.78); }
  .steps li.done .n{ background:var(--teal); border-color:var(--teal); }
  .steps li.on{ background:rgba(0,174,239,.17); color:#fff; }
  .steps li.on .n{ background:var(--cyan); border-color:var(--cyan); }

  /* The caption swaps in two beats: the old line leaves, then the new one arrives. */
  .caption{ position:relative; margin-top:auto; min-height:112px; }
  .caption p{
    position:absolute; left:0; right:0; bottom:0; margin:0;
    font:500 21px/1.36 'Ubuntu',sans-serif; color:#fff;
    transition:opacity .4s ease .28s, transform .5s ease .28s;
  }
  .caption p::before{ content:""; display:block; width:34px; height:3px; border-radius:2px; background:var(--cyan); margin-bottom:14px; }
  .caption p.pre{ opacity:0; transform:translateY(14px); }
  .caption p.out{ opacity:0; transform:translateY(-10px); transition-duration:.25s; transition-delay:0s; }

  .chips{ display:flex; flex-wrap:wrap; gap:7px; margin-top:22px; }
  .chip{ font-size:11.5px; font-weight:600; padding:6px 11px; border-radius:999px; background:rgba(255,255,255,.09); color:rgba(255,255,255,.82); }

  /* ---------- browser window holding the live site ---------- */
  #window{
    position:absolute; left:412px; top:36px; width:832px; height:648px;
    border-radius:16px; overflow:hidden; background:#fff;
    box-shadow:0 34px 90px -24px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08);
  }
  .bar{ height:34px; display:flex; align-items:center; gap:7px; padding:0 14px; background:#eef3f8; border-bottom:1px solid #dbe4ee; }
  .bar i{ width:11px; height:11px; border-radius:50%; }
  .bar i:nth-child(1){ background:#ff5f57; } .bar i:nth-child(2){ background:#febc2e; } .bar i:nth-child(3){ background:#28c840; }
  .url{
    margin-left:14px; height:22px; min-width:300px; padding:0 12px; border-radius:7px;
    display:flex; align-items:center; gap:7px; background:#fff; border:1px solid #dbe4ee;
    font-size:11.5px; color:#475569;
  }
  .url svg{ flex:none; }
  #site{ display:block; width:832px; height:614px; border:0; background:#f5fbff; }
</style>
</head>
<body>
<div id="stage" class="bg">
  <aside id="panel">
    <img class="logo" src="../../assets/hero/logo-salus.png" alt="SALUS Controls" />
    <div class="eyebrow" data-k="eyebrow"></div>
    <h1 data-k="title"></h1>
    <div class="sub" data-k="subtitle"></div>
    <ol class="steps"></ol>
    <div class="caption"></div>
    <div class="chips" data-k="chips"></div>
  </aside>

  <section id="window">
    <div class="bar">
      <i></i><i></i><i></i>
      <div class="url">
        <svg width="10" height="12" viewBox="0 0 10 12" fill="none"><rect x="1" y="5" width="8" height="6.2" rx="1.4" fill="#64748b"/><path d="M3 5V3.6a2 2 0 0 1 4 0V5" stroke="#64748b" stroke-width="1.4"/></svg>
        <span data-k="url"></span>
      </div>
    </div>
    <iframe id="site" name="site" title="site"></iframe>
  </section>
</div>

<script src="overlay.js"></script>
<script>
  /* The panel and the window - the cursor and the cards are overlay.js. */
  Object.assign(window.stage, (() => {
    const $ = (s, r = document) => r.querySelector(s);
    const fill = (root, data) => {
      root.querySelectorAll("[data-k]").forEach(el => {
        const v = data[el.dataset.k];
        if (Array.isArray(v)) el.innerHTML = v.map(c => `<span class="chip">${c}</span>`).join("");
        else el.innerHTML = v || "";
        el.style.display = v && (!Array.isArray(v) || v.length) ? "" : "none";
      });
    };
    let steps = [];

    return {
      init(cfg) {
        document.documentElement.lang = cfg.lang || "fr";
        fill($("#panel"), cfg.panel);
        fill($(".bar"), { url: cfg.url });
        $(".url").style.display = cfg.url ? "" : "none";
        stage.cards(cfg.cards, cfg.logo);
        steps = cfg.panel.steps;
        $(".steps").innerHTML = steps.map((s, i) =>
          `<li><span class="n">${i < steps.length - 1 ? i + 1 : "&#10003;"}</span><span>${s}</span></li>`).join("");
      },
      step(i, text) {
        document.querySelectorAll(".steps li").forEach((li, k) => {
          li.classList.toggle("on", k === i);
          li.classList.toggle("done", k < i);
        });
        const cap = $(".caption");
        cap.querySelectorAll("p.out").forEach(p => p.remove());
        cap.querySelectorAll("p").forEach(p => p.classList.add("out"));
        if (!text) return;
        const p = document.createElement("p");
        p.className = "pre";
        p.textContent = text;
        cap.appendChild(p);
        p.getBoundingClientRect();
        p.classList.remove("pre");
      },
    };
  })());
</script>
</body>
</html>
