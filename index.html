<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Salus Configurator - BETA</title>
<meta name="description" content="Unified SALUS Controls configurator - BETA build for internal demonstration. Fictional prices, test documents, simulated CRM." />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231D2858'/><circle cx='50' cy='50' r='26' fill='none' stroke='%2300AEEF' stroke-width='8'/><circle cx='50' cy='50' r='8' fill='%2300AEEF'/></svg>" />

<!-- Everything is bundled (vendor/): the demo runs even offline.
     Tailwind CSS compiled statically - see build/README-build.md. -->
<link rel="stylesheet" href="vendor/tailwind.css" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet" />

<script src="vendor/react.min.js"></script>
<script src="vendor/react-dom.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>

<style>
  :root{
    --cyan:#00AEEF;
    --navy:#1D2858;
    --teal:#3FB8A5;
    --gray:#A8A8A9;
  }
  html, body { margin:0; padding:0; }
  body{
    font-family:'Open Sans', system-ui, -apple-system, sans-serif;
    color:var(--navy);
    min-height:100vh;
    background:
      radial-gradient(1100px 560px at 12% -8%, rgba(0,174,239,.16) 0%, transparent 60%),
      radial-gradient(900px 520px at 108% 8%, rgba(0,174,239,.10) 0%, transparent 55%),
      #f5fbff;
  }
  h1,h2,h3,.font-ubuntu{ font-family:'Ubuntu', system-ui, sans-serif; }
  @keyframes fadeUp { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;} }
  .fadeUp{ animation:fadeUp .35s ease-out both; }
  .tile{ transition:transform .15s ease, box-shadow .18s ease, border-color .15s ease; }
  .tile:hover{ transform:translateY(-3px); box-shadow:0 14px 30px -16px rgba(29,40,88,.35); border-color:var(--cyan); }
  .tile:active{ transform:translateY(0); }
  a{ text-decoration:none; }
  /* Decorative concentric arcs (brand graphic element) */
  .arcs::before{
    content:""; position:absolute; inset:auto -180px -200px auto; width:560px; height:560px;
    border-radius:50%;
    border:1.5px solid rgba(0,174,239,.18);
    box-shadow:0 0 0 28px rgba(0,174,239,.05), 0 0 0 70px rgba(0,174,239,.035), 0 0 0 120px rgba(0,174,239,.02);
    pointer-events:none;
  }
  .arcs::after{
    content:""; position:absolute; inset:-220px auto auto -200px; width:480px; height:480px;
    border-radius:50%;
    border:1.5px solid rgba(0,174,239,.14);
    box-shadow:0 0 0 34px rgba(0,174,239,.04), 0 0 0 84px rgba(0,174,239,.025);
    pointer-events:none;
  }
  input[type=range]{ height:6px; }
</style>
</head>
<body>
<div id="root"></div>
<noscript>This BETA configurator requires JavaScript.</noscript>

<!-- Data (real catalogue / fictional prices, markets, copy) -->
<script src="js/data/catalog.js"></script>
<script src="js/data/markets.js"></script>
<script src="js/data/copy.js"></script>

<!-- Logic -->
<script src="js/engine.js"></script>
<script src="js/schematic.js"></script>
<script src="js/crm.js"></script>
<script src="js/docs.js"></script>

<!-- Interface -->
<script src="js/ui.js"></script>
<script src="js/result.js"></script>
<script src="js/app.js"></script>
</body>
</html>
